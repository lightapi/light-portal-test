name: Validate test suite

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check out frozen Workflow contracts
        uses: actions/checkout@v4
        with:
          repository: networknt/light-fabric
          path: light-fabric

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install --yes shellcheck

      - name: Install Node dependencies
        run: npm ci --ignore-scripts

      - name: Install Workflow contract validator dependencies
        working-directory: light-fabric/apps/light-workflow/contracts/workflow-admin
        run: npm ci --ignore-scripts

      - name: Validate repository
        run: make validate
